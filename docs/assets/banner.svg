<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Orvex Banner">
  <title>ORVEX - Autonomous Agent Security Runtime</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="360" rx="16" fill="#000000"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#222222" stroke-width="2"/>

  <!-- Logo Mark centered top -->
  <g transform="translate(568, 45)">
    <rect width="64" height="64" rx="14" fill="#0A0A0A" stroke="#333333" stroke-width="1.5"/>
    <path d="M32 9L52 19.5V44.5L32 55L12 44.5V19.5L32 9Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    <path d="M32 17V47M20 25.5H44M20 38.5H44" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Typography in pure white and gray -->
  <g font-family="Inter, -apple-system, sans-serif" text-anchor="middle">
    <text x="600" y="165" fill="#FFFFFF" font-size="44" font-weight="800" letter-spacing="-1.5">ORVEX</text>
    <text x="600" y="205" fill="#CCCCCC" font-size="18" font-weight="500" letter-spacing="0">The Security Runtime for Autonomous AI Agents</text>
    <text x="600" y="240" fill="#777777" font-size="13" font-weight="400">Zero-Trust Policy Engine | Composite Risk Scoring | Kernel Sandboxing | Flight Recorder</text>
    
    <rect x="475" y="275" width="250" height="30" rx="15" fill="#0A0A0A" stroke="#222222"/>
    <text x="600" y="295" fill="#888888" font-size="11" font-family="IBM Plex Mono, monospace" letter-spacing="1">DEVELOPED BY ANSH RAJORE</text>
  </g>
</svg>
