  <text x="224" y="340" fill="#8A8A8A" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18">Local-first policy · risk · approval · sandbox · audit</text>
  <text x="224" y="400" fill="#8A8A8A" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16">Developed by Ansh Rajore  ·  Dark Arcane  ·  Nashik</text>
