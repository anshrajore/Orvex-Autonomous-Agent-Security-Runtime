<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-label="Orvex Architecture">
  <title>Orvex Control Plane Architecture</title>
  <rect width="1120" height="420" rx="16" fill="#000000"/>
  <rect x="1" y="1" width="1118" height="418" rx="15" fill="none" stroke="#222222" stroke-width="2"/>
  
  <text x="40" y="48" fill="#888888" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="2">ZERO-TRUST ARCHITECTURE CONTROL PLANE</text>
  
  <g font-family="Inter, -apple-system, sans-serif" font-size="14" text-anchor="middle">
    <!-- Top Flow: Pipeline -->
    <rect x="40" y="80" width="150" height="56" rx="10" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="115" y="113" fill="#FFFFFF" font-weight="600">Autonomous Agent</text>
    
    <rect x="230" y="80" width="160" height="56" rx="10" fill="#0A0A0A" stroke="#444444"/>
    <text x="310" y="113" fill="#FFFFFF">Orvex Runtime</text>
    
    <rect x="430" y="80" width="150" height="56" rx="10" fill="#0A0A0A" stroke="#444444"/>
    <text x="505" y="113" fill="#FFFFFF">Policy Engine</text>
    
    <rect x="620" y="80" width="150" height="56" rx="10" fill="#0A0A0A" stroke="#444444"/>
    <text x="695" y="113" fill="#FFFFFF">Risk Engine</text>
    
    <rect x="810" y="80" width="270" height="56" rx="10" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="945" y="113" fill="#FFFFFF" font-weight="600">Decision: ALLOW / ASK / BLOCK</text>
    
    <!-- Connectors -->
    <path d="M190 108h40M390 108h40M580 108h40M770 108h40" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Middle Domain Row -->
    <rect x="40" y="190" width="240" height="56" rx="10" fill="#0A0A0A" stroke="#333333"/>
    <text x="160" y="223" fill="#CCCCCC">Filesystem Sandbox</text>
    
    <rect x="310" y="190" width="240" height="56" rx="10" fill="#0A0A0A" stroke="#333333"/>
    <text x="430" y="223" fill="#CCCCCC">Process AST &amp; Git</text>
    
    <rect x="580" y="190" width="240" height="56" rx="10" fill="#0A0A0A" stroke="#333333"/>
    <text x="700" y="223" fill="#CCCCCC">Network &amp; MCP Tools</text>
    
    <rect x="850" y="190" width="230" height="56" rx="10" fill="#0A0A0A" stroke="#333333"/>
    <text x="965" y="223" fill="#CCCCCC">Secret Vault Redaction</text>
    
    <!-- Bottom Execution Row -->
    <rect x="40" y="300" width="1040" height="64" rx="12" fill="#0A0A0A" stroke="#555555" stroke-width="1.5"/>
    <text x="560" y="338" fill="#FFFFFF" font-weight="600">Operating System Isolation (Seatbelt / Bubblewrap / Docker)  +  SARIF Audit Flight Recorder</text>
  </g>
</svg>
