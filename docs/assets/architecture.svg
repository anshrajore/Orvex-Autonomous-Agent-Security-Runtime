<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-label="Orvex Architecture">
  <title>Orvex Control Plane Architecture</title>
  <desc>Animated zero-trust flow from an autonomous agent through policy, risk, decision, enforcement, and audit layers.</desc>
  <defs>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#666"/>
      <stop offset="0.5" stop-color="#FFF"/>
      <stop offset="1" stop-color="#666"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flow-line { stroke-dasharray: 3 9; animation: flow 2.4s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite; }
      .pulse-delay { animation-delay: .7s; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.25); } }
      @media (prefers-reduced-motion: reduce) { .flow-line, .pulse, .pulse-delay { animation: none; } }
    </style>
  </defs>
  <rect width="1120" height="420" rx="16" fill="#000000"/>
  <rect x="1" y="1" width="1118" height="418" rx="15" fill="none" stroke="#222222" stroke-width="2"/>
  
  <text x="40" y="48" fill="#888888" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="2">ZERO-TRUST ARCHITECTURE CONTROL PLANE</text>
  
  <g font-family="Inter, -apple-system, sans-serif" font-size="14" text-anchor="middle">
    <!-- Top Flow: Pipeline -->
    <rect x="40" y="80" width="150" height="56" rx="10" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="115" y="113" fill="#FFFFFF" font-weight="600">Autonomous Agent</text>
    
    <rect x="230" y="80" width="160" height="56" rx="10" fill="#0A0A0A" stroke="#444444"/>
    <text x="310" y="113" fill="#FFFFFF">Orvex Runtime</text>
    
    <rect x="430" y="80" width="150" height="56" rx="10" fill="#0A0A0A" stroke="#444444"/>
    <text x="505" y="113" fill="#FFFFFF">Policy Engine</text>
    
    <rect x="620" y="80" width="150" height="56" rx="10" fill="#0A0A0A" stroke="#444444"/>
    <text x="695" y="113" fill="#FFFFFF">Risk Engine</text>
    
    <rect x="810" y="80" width="270" height="56" rx="10" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="945" y="113" fill="#FFFFFF" font-weight="600">Decision: ALLOW / ASK / BLOCK</text>
    
    <!-- Connectors -->
    <path class="flow-line" d="M190 108h40M390 108h40M580 108h40M770 108h40" stroke="url(#flow)" stroke-width="1.5" fill="none"/>
    <circle class="pulse" cx="210" cy="108" r="3" fill="#FFFFFF" filter="url(#softGlow)"/>
    <circle class="pulse pulse-delay" cx="410" cy="108" r="3" fill="#FFFFFF" filter="url(#softGlow)"/>
    <circle class="pulse" cx="600" cy="108" r="3" fill="#FFFFFF" filter="url(#softGlow)"/>
    <circle class="pulse pulse-delay" cx="790" cy="108" r="3" fill="#FFFFFF" filter="url(#softGlow)"/>
    
    <!-- Middle Domain Row -->
    <rect x="40" y="190" width="240" height="56" rx="10" fill="#0A0A0A" stroke="#333333"/>
    <text x="160" y="215" fill="#FFFFFF" font-size="13">Filesystem Guard</text>
    <text x="160" y="233" fill="#777777" font-size="10">paths · symlinks · secrets</text>
    
    <rect x="310" y="190" width="240" height="56" rx="10" fill="#0A0A0A" stroke="#333333"/>
    <text x="430" y="215" fill="#FFFFFF" font-size="13">Command &amp; Git Guard</text>
    <text x="430" y="233" fill="#777777" font-size="10">AST · wrappers · branch safety</text>
    
    <rect x="580" y="190" width="240" height="56" rx="10" fill="#0A0A0A" stroke="#333333"/>
    <text x="700" y="215" fill="#FFFFFF" font-size="13">Network &amp; MCP Guard</text>
    <text x="700" y="233" fill="#777777" font-size="10">DNS · CIDR · tool trust</text>
    
    <rect x="850" y="190" width="230" height="56" rx="10" fill="#0A0A0A" stroke="#333333"/>
    <text x="965" y="215" fill="#FFFFFF" font-size="13">Secret Shield</text>
    <text x="965" y="233" fill="#777777" font-size="10">detect · redact · never persist</text>

    <path class="flow-line" d="M160 136v54M430 136v54M700 136v54M965 136v54" stroke="#666666" stroke-width="1" fill="none"/>
    <circle class="pulse pulse-delay" cx="160" cy="166" r="2.5" fill="#FFFFFF"/>
    <circle class="pulse" cx="430" cy="166" r="2.5" fill="#FFFFFF"/>
    <circle class="pulse pulse-delay" cx="700" cy="166" r="2.5" fill="#FFFFFF"/>
    <circle class="pulse" cx="965" cy="166" r="2.5" fill="#FFFFFF"/>
    
    <!-- Bottom Execution Row -->
    <rect x="40" y="300" width="1040" height="64" rx="12" fill="#0A0A0A" stroke="#555555" stroke-width="1.5"/>
    <text x="560" y="326" fill="#FFFFFF" font-weight="600">Enforcement Boundary</text>
    <text x="560" y="347" fill="#888888" font-size="11">Seatbelt · Bubblewrap · Docker · resource limits · redacted SARIF flight recorder</text>
  </g>
</svg>
