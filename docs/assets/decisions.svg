<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" role="img" aria-label="Orvex Decision Spectrum">
  <title>Orvex Decision Spectrum</title>
  <rect width="1120" height="220" rx="16" fill="#000000"/>
  <rect x="1" y="1" width="1118" height="218" rx="15" fill="none" stroke="#222222" stroke-width="2"/>
  
  <g font-family="Inter, -apple-system, sans-serif">
    <!-- ALLOW -->
    <g transform="translate(40, 40)">
      <rect width="320" height="140" rx="12" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="24" y="38" fill="#FFFFFF" font-size="16" font-weight="800" font-family="IBM Plex Mono">ALLOW</text>
      <text x="24" y="70" fill="#CCCCCC" font-size="13" font-weight="500">Zero-risk or explicitly whitelisted</text>
      <text x="24" y="96" fill="#777777" font-size="12">Read project files, npm test, allowed hosts.</text>
      <text x="24" y="118" fill="#555555" font-size="11" font-family="IBM Plex Mono">Risk: 0 - 25</text>
    </g>

    <!-- ASK -->
    <g transform="translate(400, 40)">
      <rect width="320" height="140" rx="12" fill="#0A0A0A" stroke="#777777"/>
      <text x="24" y="38" fill="#CCCCCC" font-size="16" font-weight="800" font-family="IBM Plex Mono">ASK</text>
      <text x="24" y="70" fill="#CCCCCC" font-size="13" font-weight="500">Interactive human confirmation</text>
      <text x="24" y="96" fill="#777777" font-size="12">Protected git push, elevated write scope.</text>
      <text x="24" y="118" fill="#555555" font-size="11" font-family="IBM Plex Mono">Risk: 26 - 75</text>
    </g>

    <!-- BLOCK -->
    <g transform="translate(760, 40)">
      <rect width="320" height="140" rx="12" fill="#0A0A0A" stroke="#333333"/>
      <text x="24" y="38" fill="#888888" font-size="16" font-weight="800" font-family="IBM Plex Mono">BLOCK / ESCALATE</text>
      <text x="24" y="70" fill="#AAAAAA" font-size="13" font-weight="500">Zero side-effects permitted</text>
      <text x="24" y="96" fill="#777777" font-size="12">.env leak, ~/.ssh, remote shell, rm -rf.</text>
      <text x="24" y="118" fill="#555555" font-size="11" font-family="IBM Plex Mono">Risk: 76 - 100</text>
    </g>
  </g>
</svg>
