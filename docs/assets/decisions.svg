<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 280" role="img" aria-label="Allow, ask, or block">
  <title>Every sensitive action is decided</title>
  <rect width="1120" height="280" rx="16" fill="#000"/>
  <rect x="1" y="1" width="1118" height="278" rx="16" fill="none" stroke="#1F1F1F"/>
  <text x="40" y="44" fill="#8A8A8A" font-family="IBM Plex Sans, sans-serif" font-size="13" letter-spacing="3">DECISION ENGINE</text>
  <g font-family="IBM Plex Sans, sans-serif" text-anchor="middle">
    <rect x="40" y="72" width="320" height="160" rx="12" fill="#0A0A0A" stroke="#3A3A3A"/>
    <text x="200" y="132" fill="#FFFFFF" font-size="28" font-weight="600">ALLOW</text>
    <text x="200" y="168" fill="#8A8A8A" font-size="15">Explicit capability match</text>
    <rect x="400" y="72" width="320" height="160" rx="12" fill="#0A0A0A" stroke="#FF5A3C"/>
    <text x="560" y="132" fill="#FF5A3C" font-size="28" font-weight="600">ASK</text>
    <text x="560" y="168" fill="#C8C8C8" font-size="15">Human approval required</text>
    <rect x="760" y="72" width="320" height="160" rx="12" fill="#0A0A0A" stroke="#3A3A3A"/>
    <text x="920" y="132" fill="#FFFFFF" font-size="28" font-weight="600">BLOCK</text>
    <text x="920" y="168" fill="#8A8A8A" font-size="15">Default deny · no side effect</text>
  </g>
</svg>
